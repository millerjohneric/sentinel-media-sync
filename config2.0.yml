'Project_Status':
  'Version': '17.7'
  'Codenames':
    'Network': 'Source'
    'Machine': 'GEEK'
    'Volume': 'S:'
  'DriveIcon': 'the-source.ico'
  'Exclusions_Active':
    - '.webaxs'
    - 'trashbox'
    - '.git'
    - '$RECYCLE.BIN'

'Root_Layout':
  'GitHub_Repo': 'C:\Users\mille\Documents\GitHub\sentinel-media-sync'
  'Data_Root': 'C:\Source'
  'Network_Share': '\\GEEK\Source'
  'Mapped_Drive': 'S:\'

'Settings':
  'LogPath': '_log'
  'TemplateDir': 'C:\Users\mille\Documents\GitHub\sentinel-media-sync\templates'
  'DryRun': false
  'GlobalOverwrite': true
  'EmailSettings':
    'Enabled': true
    'To': 'millerjohneric@gmail.com'
    'CredPath': '.secure\gmail.cred'
  'DefaultYear': 2026
  'DateFormat': '%Y/%m Month'
  'ChronoRegex': '^\d{4}/\d{2}\s\w+$'
  'EventRegex': '^([a-zA-Z0-9_\-\s]+[/\\])*[a-zA-Z0-9_\-\s]+$'
  'PurgeTransient': true
  'DisableSidecarReunite': true
  'DisableJunkPurge': true
  'Exclusions':
    - '.webaxs'
    - '_putaway'
    - '$RECYCLE.BIN'
    - 'System Volume Information'

'FileTypes':
  'Images': ['.jpg', '.jpeg', '.png', '.heic', '.tif', '.tiff', '.heic']
  'RAWs': ['.nef', '.cr2', '.arw', '.dng']
  'Videos': ['.mp4', '.mov', '.avi', '.mkv']
  'Audio': ['.mp3', '.wav', '.flac', '.m4a']
  'Docs': ['.pdf', '.docx', '.txt']
  'Web': ['.md', '.html']
  'Sidecars': ['.xmp', '.json', '.xml']
  'Junk':
    - 'Thumbs.db'
    - 'desktop.ini'
    - '.DS_Store'
    - 'ehthumbs.db'
  'Recipes':
    - 'Images'
    - 'Docs'
    - 'Sidecars'
    - 'Web'
    - '.mp4'

