'Settings':
  'LogPath': 'H:\sentinel-media-sync\-log\'
  'DryRun': false
  'EmailSettings':
    'Enabled': true
    'To': 'millerjohneric@gmail.com'
  'DefaultYear': 2026
  'DateFormat': '%Y/%m Month'
  'ChronoRegex': '^\d{4}/\d{2}\s\w+$'
  'EventRegex': '^([a-zA-Z0-9_\-\s]+[/\\])*[a-zA-Z0-9_\-\s]+$'
  'TemplateDir': 'H:\MakeMeASammich\website\templates'
  'PurgeTransient': true
  'Exclusions':
    - '.webaxs'
    - '$RECYCLE.BIN'
    - 'System Volume Information'

'FileTypes':
  'Images': ['.jpg', '.jpeg', '.png', '.heic', '.tif', '.tiff']
  'RAWs': ['.nef', '.cr2', '.arw', '.dng']
  'Videos': ['.mp4', '.mov', '.avi', '.mkv']
  'Audio': ['.mp3', '.wav', '.flac', '.m4a']
  'Docs': ['.pdf', '.docx', '.txt']
  'Web': ['.md', '.html']
  'Sidecars': ['.xmp', '.json', '.xml']
  'Junk':
    - 'Thumbs.db'
    - 'desktop.ini'
    - '.DS_Store'
    - 'ehthumbs.db'
  'Recipes':
    - 'Images'
    - 'Docs'
    - 'Sidecars'
    - 'Web'
    - '.mp4'

'Locations':
# --- ARCHIVES (Destinations) ---
  - 'Name': 'Photos'
    'Path': 'H:\Photos'
    'Role': 'Photo_Archive'
    'MonitorDepth': 1
    'SortDepth': 1
    'RootType': 'Photos'
    'PurgeOrphan': true
    'Structure':
      - 'Chrono'

  - 'Name': 'Photography'
    'Path': 'P:\Photography'
    'Role': 'RAW_Archive'
    'MonitorDepth': 1
    'SortDepth': 1
    'PurgeOrphan': true
    'RootType': 'RAW'
    'Structure':
      - 'Chrono'
      - 'Event'

  - 'Name': 'ExcessPhotos'
    'Path': 'W:\ExcessPhotos'
    'Role': 'InPlace_Archive'
    'MonitorDepth': 2
    'PurgeOrphan': true
    'RootType': 'RAW'
    'Structure':
      - 'Chrono'
      - 'Event'

# --- PASSIVE SINKS ---
  - 'Name': 'Videos'
    'Path': 'H:\Videos'
    'Role': 'Video_Archive'
    'MonitorDepth': 0
    'SortDepth': 1
    'PurgeOrphan': true
    'RootType': 'Videos'
    'Structure':
      - 'Chrono'

  - 'Name': 'Audio'
    'Path': 'H:\Audio'
    'Role': 'Audio_Archive'
    'MonitorDepth': 0
    'SortDepth': 1
    'PurgeOrphan': true
    'RootType': 'Audio'
    'Structure':
      - 'Chrono'

# --- PICKUP ZONES (Loading Zones) ---
  - 'Name': 'John'
    'Path': 'P:\John'
    'Role': 'Pickup'
    'MonitorDepth': 99
    'SortDepth': 0
    'PurgeOrphan': true
    'Scope': 'Global'
    'Structure':
      - 'Chrono'

  - 'Name': 'Roena'
    'Path': 'P:\Roena'
    'Role': 'Pickup'
    'MonitorDepth': 99
    'SortDepth': 0
    'PurgeOrphan': true
    'Scope': 'Global'
    'Structure':
      - 'Chrono'

  - 'Name': 'BigAssTablet'
    'Path': 'P:\BigAssTablet'
    'Role': 'Pickup'
    'MonitorDepth': 99
    'SortDepth': 0
    'PurgeOrphan': true
    'Scope': 'Global'
    'Structure':
      - 'Chrono'

  - 'Name': 'CzurDoc'
    'Path': 'C:\Users\mille\Documents\CzurDoc\sources'
    'Role': 'Pickup'
    'MonitorDepth': 99
    'SortDepth': 0
    'PurgeOrphan': true
    'Scope': 'Global'
    'Structure':
      - 'Chrono'

# --- HYBRID / WEB ARCHIVES (Fixed Taxonomy) ---
  - 'Name': 'MakeMeASammich'
    'Path': 'H:\MakeMeASammich\website\docs\recipes'
    'Role': 'Hybrid_Archive'
    'MonitorDepth': 99
    'SortDepth': null
    'RootType': 'Recipes'
    'SitePath': 'H:\MakeMeASammich\website'
    'Template': 'recipe-card'
    'Overwrite': false
    'PurgeOrphan': false
    'AutoStart': true
    'GroupSeparator': '-.-'
    'Structure':
      - 'Event'